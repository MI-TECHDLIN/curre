name: curre
description: "Curre opens the task, not the app."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.13.5

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.2
  http: ^1.5.0
  # Parses SVG path data for the onboarding props (CurrePropArt), which are
  # drawn as vectors rather than shipped as images. MIT, by Dan Field.
  path_parsing: ^1.1.0
  shared_preferences: ^2.5.3
  timezone: ^0.11.2

  # Voice typing runs on the phone: Whisper tiny (OpenAI, MIT) through
  # sherpa-onnx (Apache-2.0, with ONNX Runtime, MIT). The model is a
  # one-time download, never bundled; see lib/platform/voice_model.dart.
  # Held below 2.0.0, which was days old when this landed.
  sherpa_onnx: ^1.13.8
  # The mic stream (record, BSD-3-Clause) and its permission prompt
  # (permission_handler, MIT). Audio stays in memory and on the phone.
  record: ^7.1.2
  permission_handler: ^13.0.2
  # Where the downloaded model lives (BSD-3-Clause) and the SHA-256 check
  # each file must pass before it is used (BSD-3-Clause).
  path_provider: ^2.1.6
  crypto: ^3.0.7

  # Icons: the Solar set in its Bold style, the captain's pick after the
  # icon-pack comparison (2026-10-24: "for the icon solar bold is fine").
  # CurreGlyph maps Curre's semantic glyphs onto it in one place. The
  # Flutter package is BSD-3-Clause; the icon designs are 480 Design's
  # Solar set under CC BY 4.0, credited on the licences page
  # (registerCurreLicenses). Fonts are the only other outside files.
  solar_icons: ^0.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # Curre draws every glyph in code (CurreGlyph) and does not reference
  # Icons.* directly, but framework defaults (AppBar's BackButton, etc.)
  # still fall back to the Material icon font. Flip to false only once
  # those are replaced too (design report 3.10) — Door Lab's AppBar is
  # pushed as a route now, so it needs a working back icon.
  uses-material-design: true

  assets:
    - assets/licenses/OFL-Geologica.txt
    - assets/licenses/OFL-Newsreader.txt
    - assets/licenses/OFL-AtkinsonHyperlegibleMono.txt
    - assets/licenses/MIT-FluentEmoji.txt
    - assets/licenses/MIT-Whisper.txt
    - assets/licenses/MIT-ONNXRuntime.txt

  fonts:
    - family: Geologica
      fonts:
        - asset: assets/fonts/Geologica[CRSV,SHRP,slnt,wght].ttf
    - family: Newsreader
      fonts:
        - asset: assets/fonts/Newsreader-Italic[opsz,wght].ttf
          style: italic
    - family: AtkinsonHyperlegibleMono
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegibleMono[wght].ttf
