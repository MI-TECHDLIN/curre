[project]
name = "curre-server"
version = "0.1.0"
description = "Curre backend: /v1/plan and /v1/unlock over the Clocked Pipeline API"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency injection idiom is `param: T = Depends(...)`.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
